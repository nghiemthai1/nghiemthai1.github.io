<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Digital twin education checks</title>
</head>
<body>
  <h1>Digital twin education checks</h1>
  <ol id="results" aria-live="polite"></ol>
  <script type="module">
    import { answerGroundedQuestion, buildProfileRecords, formatRecord } from '../cloudflare-worker/index.js';

    const data = await (await fetch('../assets/data/experience.json')).json();
    const records = buildProfileRecords(data);
    const results = document.querySelector('#results');
    const UNKNOWN = 'That detail is not included in my public experience profile.';
    const educationIds = [
      'education-ms-business-analytics',
      'education-bs-electrical-computer-engineering',
    ];
    const exactAnswer = 'I hold two degrees:\n- **M.S. in Business Analytics:** Temple University, 2020-2023, GPA 4.0.\n- **B.S. in Electrical & Computer Engineering:** Rowan University, 2015-2019, GPA 3.98, Summa Cum Laude.';
    let failures = 0;

    function check(name, passed) {
      failures += passed ? 0 : 1;
      const item = document.createElement('li');
      item.dataset.result = passed ? 'pass' : 'fail';
      item.textContent = `${passed ? 'PASS' : 'FAIL'}: ${name}`;
      results.append(item);
    }

    function scriptedAI(responses) {
      return {
        async run() {
          if (!responses.length) throw new Error('Unexpected model call');
          return { response: responses.shift() };
        },
      };
    }

    const education = records.filter((record) => record.kind === 'education');
    check('exactly two public education records exist', education.length === 2);
    check('Temple is the M.S. in Business Analytics',
      education.some((record) => record.id === educationIds[0]
        && record.credential === 'M.S. Business Analytics'
        && record.institution === 'Temple University'
        && record.dates === '2020-2023'
        && record.gpa === '4.0'));
    check('Rowan is the B.S. in Electrical & Computer Engineering',
      education.some((record) => record.id === educationIds[1]
        && record.credential === 'B.S. Electrical & Computer Engineering'
        && record.institution === 'Rowan University'
        && record.dates === '2015-2019'
        && record.gpa === '3.98'
        && record.honors.includes('Summa Cum Laude')));
    check('formatted evidence preserves institutions, degrees, dates, and GPAs',
      education.every((record) => {
        const text = formatRecord(record);
        return text.includes(record.credential) && text.includes(record.institution)
          && text.includes(record.dates) && text.includes(record.gpa);
      }));

    const route = '{"intent":"professional","facet":"education"}';
    const degreeAI = scriptedAI([route, exactAnswer, '{"grounded":true}']);
    const degreeResult = await answerGroundedQuestion(degreeAI, 'What degrees do you have?', [], records);
    check('grounded degree response preserves every exact CV fact',
      degreeResult.answer === exactAnswer
        && degreeResult.route.recordIds.join(',') === educationIds.join(',')
        && !/Computer Science|Ph\.?D\.?|MBA/.test(degreeResult.answer));

    const unsupportedDegreeQuestions = ['Do you have a Ph.D.?', 'Did you earn an MBA?', 'Did you study at Harvard?'];
    for (const question of unsupportedDegreeQuestions) {
      const ai = scriptedAI(['{"decision":"unknown","record_ids":[]}']);
      check(`unlisted education is not answered: ${question}`,
        (await answerGroundedQuestion(ai, question, [], records)).answer === UNKNOWN);
    }

    const wrongDegreeAI = scriptedAI([
      route,
      'I earned a B.S. in Computer Science from Temple University and an MBA from Rowan University.',
      '{"grounded":false}',
    ]);
    check('degree mismatch is suppressed by the grounding verifier',
      (await answerGroundedQuestion(wrongDegreeAI, 'What degrees do you have?', [], records)).answer === UNKNOWN);

    const wrongGpaAI = scriptedAI([
      route,
      'I earned a 3.9 GPA at Temple University.',
      '{"grounded":false}',
    ]);
    check('incorrect GPA is suppressed by the grounding verifier',
      (await answerGroundedQuestion(wrongGpaAI, 'What was your GPA?', [], records)).answer === UNKNOWN);

    document.body.dataset.status = failures ? 'failed' : 'passed';
    document.title = failures ? `${failures} education checks failed` : 'All education checks passed';
  </script>
</body>
</html>
