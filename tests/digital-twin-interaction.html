<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Digital twin interaction checks</title>
  <link rel="stylesheet" href="../css/digital-twin.css?v=interaction-test">
</head>
<body>
  <h1>Digital twin interaction checks</h1>
  <ul id="results"></ul>
  <div id="fixture"></div>
  <script type="module">
    const fixture = document.querySelector('#fixture');
    fixture.innerHTML = await fetch('../partials/digital-twin.html').then((response) => response.text());

    let turnstileOptions;
    let turnstileResets = 0;
    let tokenSequence = 0;
    window.turnstile = {
      render(container, options) {
        turnstileOptions = options;
        queueMicrotask(() => options.callback(`test-token-${++tokenSequence}`));
        return 'test-widget';
      },
      reset() {
        turnstileResets += 1;
        queueMicrotask(() => turnstileOptions.callback(`test-token-${++tokenSequence}`));
      },
    };

    const realFetch = window.fetch.bind(window);
    const outboundBodies = [];
    window.fetch = (input, options = {}) => {
      if (!String(input).includes('thai-digital-twin-api.nghiemthai1.workers.dev')) {
        return realFetch(input, options);
      }
      outboundBodies.push(JSON.parse(options.body));
      const question = outboundBodies.at(-1).question;
      const answer = question.includes('degrees')
        ? 'I hold two degrees:\n- **M.S. in Business Analytics:** Temple University, 2020-2023, GPA 4.0.\n- **B.S. in Electrical & Computer Engineering:** Rowan University, 2015-2019, GPA 3.98.'
        : 'I built several machine-learning projects:\n- **Face identification:** A MATLAB system using DCT features and KNN classification.\n- **Early diagnosis:** A digital clock drawing analysis system.';
      const encoder = new TextEncoder();
      return Promise.resolve(new Response(new ReadableStream({
        start(controller) {
          const timer = setTimeout(() => {
            controller.enqueue(encoder.encode(`data: ${JSON.stringify({ response: answer })}\n\n`));
            controller.enqueue(encoder.encode('data: [DONE]\n\n'));
            controller.close();
          }, 20);
          options.signal?.addEventListener('abort', () => {
            clearTimeout(timer);
            controller.error(new DOMException('Stopped', 'AbortError'));
          }, { once: true });
        },
      }), {
        headers: {
          'Content-Type': 'text/event-stream',
          'X-Digital-Twin-Session': 'test-session',
        },
      }));
    };
    const { initializeDigitalTwin } = await import('../js/digital-twin.js?v=interaction-test-5');
    const { countWords, dedupeNumberedItems, endsWithSentence, finalizeResponse } = await import('../js/digital-twin-response.js?v=interaction-test-4');
    await initializeDigitalTwin();

    const results = document.querySelector('#results');
    let failures = 0;
    function check(name, passed) {
      failures += passed ? 0 : 1;
      const item = document.createElement('li');
      item.textContent = `${passed ? 'PASS' : 'FAIL'}: ${name}`;
      results.append(item);
    }

    check(
      'AI accuracy disclaimer is always present',
      document.querySelector('.digital-twin__disclaimer')?.textContent === 'AI-generated responses might not be true.',
    );

    check('Cloudflare AI is ready without a model download', !document.querySelector('[data-twin-download]') && !document.querySelector('[data-twin-input]').disabled);
    check('Cloudflare processing is disclosed', document.querySelector('#digital-twin-disclosure').textContent.includes('Cloudflare'));
    check('managed human verification completed', document.querySelector('[data-digital-twin]').dataset.verified === 'true');

    const input = document.querySelector('[data-twin-input]');
    input.value = 'What did you do at EY?';
    input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    await new Promise((resolve) => setTimeout(resolve, 0));
    check('Enter sends', document.querySelectorAll('.digital-twin__message--user').length === 1);
    check(
      'request sends only conversation data and a one-time verification token',
      outboundBodies[0]?.turnstileToken === 'test-token-1'
        && !Object.hasOwn(outboundBodies[0], 'recordIds')
        && !Object.hasOwn(outboundBodies[0], 'facts'),
    );
    check(
      'thinking indicator appears before the first token',
      document.querySelector('.digital-twin__thinking')?.textContent === '...',
    );
    await new Promise((resolve) => setTimeout(resolve, 25));
    check('first answer completes', !document.querySelector('.digital-twin__thinking'));
    check('human verification is not repeated after the first request', turnstileResets === 0 && !input.disabled);

    input.value = 'Can you tell me more';
    input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    await new Promise((resolve) => setTimeout(resolve, 0));
    check(
      'follow-up sends prior conversation and the verified session',
      outboundBodies[1]?.sessionToken === 'test-session'
        && outboundBodies[1]?.turnstileToken === ''
        && outboundBodies[1]?.history?.some((message) => message.content === 'What did you do at EY?'),
    );
    await new Promise((resolve) => setTimeout(resolve, 25));
    check(
      'professional follow-up is answered instead of refused',
      ![...document.querySelectorAll('.digital-twin__message--assistant p')].at(-1)?.textContent.includes('only answer'),
    );

    document.querySelector('[data-twin-clear]').click();
    await new Promise((resolve) => setTimeout(resolve, 0));
    input.value = 'Keep editing';
    input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', shiftKey: true, bubbles: true, cancelable: true }));
    check('Shift+Enter does not send', document.querySelectorAll('.digital-twin__message--user').length === 0);

    document.querySelector('[data-twin-suggestion]').click();
    await new Promise((resolve) => setTimeout(resolve, 0));
    check('previous EY starter question is restored', document.querySelector('.digital-twin__message--user p')?.textContent.includes('impact have you delivered at EY'));
    check('thinking indicator appears for a later request', document.querySelector('.digital-twin__thinking')?.textContent === '...');
    await new Promise((resolve) => setTimeout(resolve, 25));
    check('thinking indicator is replaced by the answer', !document.querySelector('.digital-twin__thinking'));
    check('verified session remains active for later requests', turnstileResets === 0 && !input.disabled);
    const formattedAnswer = [...document.querySelectorAll('.digital-twin__message--assistant p')].at(-1);
    check(
      'completed answer renders clean bullet and bold formatting',
      formattedAnswer.querySelectorAll('.digital-twin__response-item').length === 2
        && formattedAnswer.querySelector('strong')?.textContent === 'Face identification:'
        && formattedAnswer.querySelectorAll('.digital-twin__response-bullet').length === 2
        && !formattedAnswer.textContent.includes('**'),
    );

    input.value = 'What projects have you built?';
    input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    await new Promise((resolve) => setTimeout(resolve, 0));
    document.querySelector('[data-twin-cancel]').click();
    await new Promise((resolve) => setTimeout(resolve, 0));
    check(
      'cancelling replaces the thinking indicator',
      !document.querySelector('.digital-twin__thinking')
        && [...document.querySelectorAll('.digital-twin__message--assistant p')].at(-1)?.textContent === 'Response stopped.',
    );

    input.value = 'What degrees do you have?';
    input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    await new Promise((resolve) => setTimeout(resolve, 25));
    const degreeAnswer = [...document.querySelectorAll('.digital-twin__message--assistant p')].at(-1);
    check(
      'degree question is routed through the grounded Worker',
      outboundBodies.at(-1)?.question === 'What degrees do you have?'
        && !Object.hasOwn(outboundBodies.at(-1), 'recordIds')
        && degreeAnswer.textContent.includes('M.S. in Business Analytics: Temple University, 2020-2023, GPA 4.0.')
        && degreeAnswer.textContent.includes('B.S. in Electrical & Computer Engineering: Rowan University, 2015-2019, GPA 3.98.'),
    );
    check(
      'degree answer renders as two clean labeled facts',
      degreeAnswer.querySelectorAll('.digital-twin__response-item').length === 2
        && degreeAnswer.querySelectorAll('strong').length === 2
        && !degreeAnswer.textContent.includes('**'),
    );

    const verbose = Array.from(
      { length: 28 },
      () => 'I delivered a focused automation solution with measurable operational results for the client team.',
    ).join(' ');
    const limited = finalizeResponse(verbose);
    check('long answers stay within 220 words', countWords(limited) <= 220 && endsWithSentence(limited));

    const repaired = finalizeResponse('I led automation delivery for clients. I also started an unfinished explanation about');
    check('unfinished trailing text is removed', repaired === 'I led automation delivery for clients.');

    const repeated = dedupeNumberedItems(
      'Projects include: 1. A MATLAB face-identification system. 2. An Alzheimer\'s detection system. 3. A digital clock drawing test. 4. A digital clock drawing test. 5. A digital clock drawing test.',
    );
    check(
      'duplicate numbered items are removed and renumbered',
      repeated === 'Projects include:\n1. A MATLAB face-identification system.\n2. An Alzheimer\'s detection system.\n3. A digital clock drawing test.',
    );
    const datedProse = 'I started in 2021. I advanced in 2022. I continued growing.';
    check('dates are not treated as numbered list items', dedupeNumberedItems(datedProse) === datedProse);

    document.body.dataset.status = failures ? 'failed' : 'passed';
    document.title = failures ? `${failures} interaction checks failed` : 'All interaction checks passed';
  </script>
</body>
</html>
