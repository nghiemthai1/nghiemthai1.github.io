<div class="digital-twin" data-digital-twin data-scene-state="idle" data-exchange="empty">
   <aside class="digital-twin__stage" aria-label="Cinematic illustration of Thai working at a laptop">
      <div class="digital-twin__scene" data-twin-scene data-scene-status="waiting" aria-hidden="true">
         <picture>
            <source
               media="(max-width: 700px)"
               srcset="assets/images/digital-twin-shared/chin/frame-05-settled.jpg"
            />
            <img
               class="digital-twin__scene-poster"
               src="assets/images/digital-twin-shared/chin/frame-05-settled.jpg"
               alt=""
               width="941"
               height="1672"
               data-twin-scene-poster
            />
         </picture>
      </div>
   </aside>

   <button
      class="digital-twin__launcher"
      type="button"
      aria-label="Ask Thai, AI portfolio assistant"
      aria-expanded="false"
      aria-controls="digital-twin-panel"
      data-twin-launcher
   >
      <span class="digital-twin__launcher-mark" aria-hidden="true">
         <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 5.5a3 3 0 0 0-5.92.69A3.5 3.5 0 0 0 4 9.4c0 1.1.5 2.08 1.29 2.72A3.5 3.5 0 0 0 9 17v1a3 3 0 0 0 3 3V5.5Z" />
            <path d="M12 5.5a3 3 0 0 1 5.92.69A3.5 3.5 0 0 1 20 9.4c0 1.1-.5 2.08-1.29 2.72A3.5 3.5 0 0 1 15 17v1a3 3 0 0 1-3 3V5.5Z" />
            <path d="M6.1 6.2c.45.2.86.5 1.18.88M5.3 12.1c.58-.46 1.3-.73 2.06-.73M9 17c0-1.05.45-2 1.17-2.66M17.9 6.2c-.45.2-.86.5-1.18.88M18.7 12.1a3.27 3.27 0 0 0-2.06-.73M15 17c0-1.05-.45-2-1.17-2.66" />
         </svg>
      </span>
      <span class="digital-twin__launcher-label" aria-hidden="true">Ask Th<span class="digital-twin__launcher-ai">[AI]</span></span>
   </button>

   <section
      class="digital-twin__panel"
      id="digital-twin-panel"
      role="region"
      aria-labelledby="digital-twin-title"
      aria-describedby="digital-twin-disclosure"
      data-twin-panel
      tabindex="-1"
      hidden
   >
      <header class="digital-twin__header">
         <div class="digital-twin__identity">
            <span class="digital-twin__presence" aria-hidden="true"></span>
            <div>
               <p class="digital-twin__eyebrow">Public career Q&amp;A</p>
               <h2 id="digital-twin-title">A conversation with <span class="digital-twin__name">Th<b>[AI]</b></span></h2>
            </div>
         </div>
         <p class="digital-twin__disclosure" id="digital-twin-disclosure">
            <span class="digital-twin__disclosure-mark" aria-hidden="true">AI</span>
            <span>
               Answers use Thai Nghiem's public professional profile and are processed by Cloudflare.
               <span class="digital-twin__disclaimer">AI-generated responses may be inaccurate.</span>
            </span>
         </p>
         <div class="digital-twin__header-actions">
            <button class="digital-twin__clear-button" type="button" data-twin-clear>
               <span aria-hidden="true">&#8635;</span>
               <span>New chat</span>
            </button>
            <button class="digital-twin__icon-button" type="button" aria-label="Close conversation" data-twin-close>
               <span aria-hidden="true">&times;</span>
            </button>
         </div>
      </header>

      <div class="digital-twin__workspace">
         <section class="digital-twin__conversation" aria-label="Professional conversation">
            <div class="digital-twin__conversation-intro" data-twin-intro>
               <span class="digital-twin__name" aria-hidden="true">Th<b>[AI]</b></span>
               <p>Ask me about my work.</p>
            </div>

            <div class="digital-twin__setup">
               <p class="digital-twin__status" role="status" aria-live="polite" data-twin-status>Loading experience profile...</p>
               <div class="digital-twin__verification" data-twin-turnstile aria-label="Human verification" tabindex="-1"></div>
            </div>

            <ol class="digital-twin__messages" aria-live="polite" aria-label="Conversation" data-twin-messages></ol>
         </section>
      </div>

      <div class="digital-twin__scene-caption" aria-hidden="true">
         <span class="digital-twin__scene-pulse"></span>
         <span data-twin-scene-label>Ready when you are</span>
      </div>

      <div class="digital-twin__composer-shell">
         <form class="digital-twin__composer" data-twin-form>
            <label class="sr-only" for="digital-twin-input">Question about Thai's professional experience</label>
            <span class="digital-twin__composer-mark" aria-hidden="true">&#10022;</span>
            <textarea
               id="digital-twin-input"
               rows="1"
               maxlength="500"
               placeholder="Ask anything about Thai..."
               autocomplete="off"
               data-twin-input
               disabled
            ></textarea>
            <button class="digital-twin__send" type="submit" data-twin-send disabled>
               <span>Send</span>
               <span aria-hidden="true">&nearr;</span>
            </button>
            <button class="digital-twin__cancel" type="button" data-twin-cancel hidden>Stop</button>
         </form>

         <section class="digital-twin__suggestions" aria-labelledby="digital-twin-suggestions-title" data-twin-suggestions>
            <p id="digital-twin-suggestions-title">Try asking:</p>
            <div>
               <button type="button" data-twin-suggestion>What impact have you delivered at EY?</button>
               <button type="button" data-twin-suggestion>How did your role evolve at American Water?</button>
               <button type="button" data-twin-suggestion>Which machine-learning projects have you built?</button>
               <button type="button" data-twin-suggestion>What technologies do you use?</button>
            </div>
         </section>

      </div>
   </section>
</div>
