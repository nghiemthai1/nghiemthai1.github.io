<div class="digital-twin" data-digital-twin>
   <button
      class="digital-twin__launcher"
      type="button"
      aria-expanded="false"
      aria-controls="digital-twin-panel"
      data-twin-launcher
   >
      <span class="digital-twin__launcher-mark" aria-hidden="true">AI</span>
      <span>Ask Thai AI</span>
   </button>

   <section
      class="digital-twin__panel"
      id="digital-twin-panel"
      role="dialog"
      aria-modal="false"
      aria-labelledby="digital-twin-title"
      aria-describedby="digital-twin-disclosure"
      data-twin-panel
      hidden
   >
      <header class="digital-twin__header">
         <div>
            <p class="digital-twin__eyebrow">Public career Q&amp;A</p>
            <h2 id="digital-twin-title">Thai's Professional AI Assistant</h2>
         </div>
         <button class="digital-twin__icon-button" type="button" aria-label="Close chat" data-twin-close>&times;</button>
      </header>

      <p class="digital-twin__disclosure" id="digital-twin-disclosure">
         Answers from Thai Nghiem's public professional profile · Processed by Cloudflare.
      </p>

      <div class="digital-twin__setup">
         <p class="digital-twin__status" role="status" aria-live="polite" data-twin-status>Loading experience profile...</p>
         <div class="digital-twin__verification" data-twin-turnstile aria-label="Human verification" tabindex="-1"></div>
      </div>

      <section class="digital-twin__suggestions" aria-labelledby="digital-twin-suggestions-title" data-twin-suggestions>
         <p id="digital-twin-suggestions-title">Suggested questions</p>
         <div>
            <button type="button" data-twin-suggestion>What impact have you delivered at EY?</button>
            <button type="button" data-twin-suggestion>How did your role evolve at American Water?</button>
            <button type="button" data-twin-suggestion>Which machine-learning projects have you built?</button>
            <button type="button" data-twin-suggestion>What technologies do you use?</button>
         </div>
      </section>

      <ol class="digital-twin__messages" aria-live="polite" aria-label="Conversation" data-twin-messages></ol>

      <form class="digital-twin__composer" data-twin-form>
         <label class="sr-only" for="digital-twin-input">Question about Thai's professional experience</label>
         <textarea
            id="digital-twin-input"
            rows="1"
            maxlength="500"
            placeholder="Ask about my experience..."
            autocomplete="off"
            data-twin-input
            disabled
         ></textarea>
         <button class="digital-twin__send" type="submit" data-twin-send disabled>Send</button>
         <button class="digital-twin__cancel" type="button" data-twin-cancel hidden>Stop</button>
      </form>

      <div class="digital-twin__footer">
         <span>English only</span>
         <span class="digital-twin__disclaimer">AI-generated responses might not be true.</span>
         <button type="button" data-twin-clear>Clear conversation</button>
      </div>
   </section>
</div>
